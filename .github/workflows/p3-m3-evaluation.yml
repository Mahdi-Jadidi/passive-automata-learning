name: P3 M3 benchmark evaluation

on:
  push:
    branches: [research/v2-benchmarks]
    paths:
      - .github/workflows/p3-m3-evaluation.yml
      - benchmarks/v2/p3/m3-native.json
      - benchmarks/v2/p3_m3.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.select.outputs.cases }}
      profiles: ${{ steps.select.outputs.profiles }}
      paired: ${{ steps.select.outputs.paired }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /benchmarks/v2/p3/m3-native.json
      - id: select
        run: |
          if test -f benchmarks/v2/p3/m3-native.json; then
            echo 'paired=true'
            echo 'cases=["tiny_choice","small_choice","medium_choice","huge_choice_active","hdfs_1024","hdfs_holdout_1024_uncapped","cover_path_8","nonempty_root"]'
            echo 'profiles=[1536,512]'
          else
            echo 'paired=false'
            echo 'cases=["small_choice","hdfs_1024","hdfs_holdout_1024_uncapped","cover_path_8","nonempty_root"]'
            echo 'profiles=[1536]'
          fi >> "$GITHUB_OUTPUT"
  benchmark:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.matrix.outputs.cases) }}
        memory: ${{ fromJSON(needs.matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /benchmarks/v2/p3_harness.py
            /benchmarks/v2/test_p3_harness.py
            /benchmarks/v2/p3_native.py
            /benchmarks/v2/p3_m3.py
            /benchmarks/v2/p3/native.json
            /benchmarks/v2/p3/m3-native.json
            /benchmarks/v2/p3/inputs/
            /benchmarks/v2/review03/p3/input-manifest.json
      - uses: actions/checkout@v4
        with:
          ref: 391abf97df3b67661082c907d9ce20b4f69636c2
          path: m2-producer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /implementation/partition_feedback_final/selector_v2/*.py
      - uses: actions/checkout@v4
        with:
          ref: d89bab4c005d17c8b27d4c1e6dd291135aca649a
          path: m2-verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tests/reference/*.py
      - id: pins
        if: needs.matrix.outputs.paired == 'true'
        run: |
          for role in producer verifier; do
            commit=$(jq -er --arg role "$role" '.sources[$role].commit | select(test("^[0-9a-f]{40}$"))' benchmarks/v2/p3/m3-native.json)
            echo "$role=$commit" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        if: needs.matrix.outputs.paired == 'true'
        with:
          ref: ${{ steps.pins.outputs.producer }}
          path: m3-producer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /implementation/partition_feedback_final/selector_v2/*.py
      - uses: actions/checkout@v4
        if: needs.matrix.outputs.paired == 'true'
        with:
          ref: ${{ steps.pins.outputs.verifier }}
          path: m3-verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tests/reference/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Check harness in both interpreters
        if: matrix.case == 'nonempty_root'
        working-directory: benchmarks/v2
        run: |
          python -B -m unittest -v test_p3_harness
          python -B -O -m unittest -v test_p3_harness
      - name: Run case
        env:
          CASE: ${{ matrix.case }}
          MEMORY: ${{ matrix.memory }}
          PAIRED: ${{ needs.matrix.outputs.paired }}
        run: |
          test ! -e benchmarks/v2/review03/p3/evaluation
          args=(--audit)
          if [[ "$PAIRED" == true ]]; then
            args=(--m3-config benchmarks/v2/p3/m3-native.json --m3-producer-root m3-producer --m3-verifier-root m3-verifier)
          fi
          python -B benchmarks/v2/p3_m3.py --case "$CASE" --memory-mib "$MEMORY" \
            --producer-root m2-producer --verifier-root m2-verifier \
            --output "$RUNNER_TEMP/evidence" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-m3-evaluation-${{ matrix.case }}-${{ matrix.memory }}
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/*/producer-source/**
            !${{ runner.temp }}/evidence/*/verifier-source/**
            !${{ runner.temp }}/evidence/**/certificate.json.tmp
            !${{ runner.temp }}/evidence/**/producer-2/certificate.json
          if-no-files-found: error
