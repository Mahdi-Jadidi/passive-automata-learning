name: P3 independent frontier verifier

on:
  push:
    branches:
      - research/v2-proof-audit
    paths:
      - "tests/reference/p3_frontier_verifier.py"
      - "tests/reference/test_p3_frontier_verifier.py"
      - "tests/reference/rgs_oracle.py"
      - "tests/reference/journal_v2_replay.py"
      - "tests/reference/independent_replay.py"
      - "tests/reference/production_replay.py"
      - "tests/reference/ledger_replay.py"
      - "tests/reference/interface_artifact_replay.py"
      - "tests/reference/bounded_deletion.py"
      - "research/audit/P3_REGION_COVERAGE_CONTRACT.md"
      - ".github/workflows/p3-frontier-verifier.yml"
  pull_request:
    paths:
      - "tests/reference/p3_frontier_verifier.py"
      - "tests/reference/test_p3_frontier_verifier.py"
      - "tests/reference/rgs_oracle.py"
      - "tests/reference/journal_v2_replay.py"
      - "tests/reference/independent_replay.py"
      - "tests/reference/production_replay.py"
      - "tests/reference/ledger_replay.py"
      - "tests/reference/interface_artifact_replay.py"
      - "tests/reference/bounded_deletion.py"
      - "research/audit/P3_REGION_COVERAGE_CONTRACT.md"
      - ".github/workflows/p3-frontier-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-p3-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Exact source pins and runtime
        run: |
          python --version
          git rev-parse HEAD
          git hash-object tests/reference/p3_frontier_verifier.py tests/reference/test_p3_frontier_verifier.py tests/reference/rgs_oracle.py tests/reference/bounded_deletion.py tests/reference/journal_v2_replay.py
      - name: Verify normal Python mode
        env:
          PYTHONPATH: tests/reference
        run: |
          ulimit -v 1572864
          /usr/bin/time -f 'wall=%e RSS_KiB=%M' python -B -m unittest discover -s tests/reference -p "test_p3_frontier_verifier.py" -v
      - name: Verify optimized Python mode
        env:
          PYTHONPATH: tests/reference
        run: |
          ulimit -v 1572864
          /usr/bin/time -f 'wall=%e RSS_KiB=%M' python -B -O -m unittest discover -s tests/reference -p "test_p3_frontier_verifier.py" -v
