name: P3 native compact v2 gate
on:
  push:
    branches: [research/v2-scale-experiment]
    paths:
      - .github/workflows/p3-scale-native.yml
      - implementation/partition_feedback_final/selector_v2/scale_*.py
      - implementation/partition_feedback_final/research/p3-scale/gate_search.py
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        memory: [512, 1536]
        suite: [native, medium_choice, huge_choice_active]
    env:
      PYTHONPATH: implementation/partition_feedback_final:implementation/partition_feedback_final/selector_v2/tests:implementation/partition_feedback_final/research/p3-m4:proof/tests/reference
      GATE: implementation/partition_feedback_final/research/p3-scale/gate_search.py
      FIXTURES: fixtures/benchmarks/v2/p3/inputs
      RETAINED: retained/benchmarks/v2/results/review08/trusted-roots
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: implementation/partition_feedback_final
      - uses: actions/checkout@v4
        with:
          ref: 98e913a7e15d32638319832fc69edb36edb2f505
          path: proof
          sparse-checkout: tests/reference
      - uses: actions/checkout@v4
        with:
          ref: 8484b8bff5b93e1be3a7924697161efc34e481d8
          path: fixtures
          sparse-checkout: benchmarks/v2/p3/inputs
      - uses: actions/checkout@v4
        with:
          ref: 444cea666816a4faaf875a831ec4a3949c673a4b
          path: retained
          sparse-checkout: benchmarks/v2/results/review08/trusted-roots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Produce and replay complete certificates
        if: matrix.suite == 'native'
        run: |
          mkdir evidence
          /usr/bin/time -v -o evidence/normal.time python -B "$GATE" --fixtures "$FIXTURES" --memory-mib ${{ matrix.memory }} --output evidence/normal
          /usr/bin/time -v -o evidence/optimized.time python -B -O "$GATE" --fixtures "$FIXTURES" --memory-mib ${{ matrix.memory }} --output evidence/optimized
          while IFS= read -r file; do
            cmp "$file" "evidence/optimized/${file#evidence/normal/}"
          done < <(find evidence/normal -name complete.json -o -name 'resumed-*.json')
      - name: Profile contracted sources
        if: matrix.suite != 'native'
        env:
          CASE: ${{ matrix.suite }}
        run: |
          mkdir evidence
          for runtime in normal optimized; do
            flags=(-B)
            if [ "$runtime" = optimized ]; then flags+=(-O); fi
            for arm in dense sparse compact compact-target; do
              out="evidence/$runtime/$arm"
              common=(--fixtures "$FIXTURES" --retained "$RETAINED" --case "$CASE" --arm "$arm" --output "$out" --memory-mib ${{ matrix.memory }})
              timeout 60 python "${flags[@]}" "$GATE" "${common[@]}" --stage prepare
              timeout 30 python "${flags[@]}" "$GATE" "${common[@]}" --stage search
              if [ -f "$out/certificate.json" ]; then
                if timeout 30 python "${flags[@]}" "$GATE" "${common[@]}" --stage replay; then
                  :
                else
                  rc=$?
                  if [ "$rc" != 124 ]; then exit "$rc"; fi
                  echo '{"status":"INCOMPLETE","reason":"HARD_TIMEOUT"}' > "$out/replay.json"
                fi
              fi
              cat "$out/metrics.json"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-scale-${{ matrix.memory }}-${{ matrix.suite }}
          path: evidence/
