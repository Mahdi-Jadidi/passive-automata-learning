name: Review08 controlled ablations
on:
  push:
    branches: [research/v2-benchmarks]
    paths:
      - .github/workflows/review08-ablation.yml
      - benchmarks/v2/review08_ablation.py
      - benchmarks/v2/p3/review08-ablation.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case: [tiny_choice, small_choice, cover_path_8, medium_choice, huge_choice_active, hdfs_1024, hdfs_holdout_1024_uncapped]
        memory: [512, 1536]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/v2
      - uses: actions/checkout@v4
        with:
          ref: 140b4e51f89baf8c3e38e18d704d8c4d36c24f39
          path: source-core
          persist-credentials: false
          sparse-checkout: implementation/partition_feedback_final/selector_v2
      - uses: actions/checkout@v4
        with:
          ref: 5a10e649a91f8c5b159b818de7e71d4028b8170d
          path: source-proof
          persist-credentials: false
          sparse-checkout: tests/reference
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Run controlled ablations
        run: |
          python -B benchmarks/v2/review08_ablation.py --case ${{ matrix.case }} \
            --memory-mib ${{ matrix.memory }} --producer source-core --verifier source-proof \
            --output "$RUNNER_TEMP/review08"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review08-ablation-${{ matrix.case }}-${{ matrix.memory }}
          path: |
            ${{ runner.temp }}/review08
            !${{ runner.temp }}/review08/*-source/**
          if-no-files-found: error
