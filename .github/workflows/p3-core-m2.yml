name: P3 core M2 exact search candidate
on:
  push:
    branches: [research/v2-implementation-core]
    paths:
      - implementation/partition_feedback_final/selector_v2/edr_search.py
      - implementation/partition_feedback_final/selector_v2/tests/test_edr_search.py
      - implementation/partition_feedback_final/research/p3-m2/**
      - .github/workflows/p3-core-m2.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e1d022496f98bf50fd57d5ef3a7a0bc8194c817c
          path: independent-proof
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          check-latest: false
      - name: Verify source pins and run normal and optimized
        env:
          PYTHONPATH: ${{ github.workspace }}/implementation/partition_feedback_final:${{ github.workspace }}/independent-proof/tests/reference
        run: |
          set -e
          test "$(git hash-object implementation/partition_feedback_final/selector_v2/edr_bb.py)" = 657c4e0e4059b32cd9e6477e61c7a3673290f36d
          test "$(git hash-object implementation/partition_feedback_final/selector_v2/edr_search.py)" = 73da7bea551df73a8676b0adf0401cd7f2d307b5
          test "$(git -C independent-proof rev-parse HEAD)" = e1d022496f98bf50fd57d5ef3a7a0bc8194c817c
          test "$(git -C independent-proof hash-object tests/reference/p3_frontier_verifier.py)" = a35281492e2677f0c57d8955227bc233d95492ea
          test "$(git -C independent-proof hash-object tests/reference/rgs_oracle.py)" = 375c36bfb2602894ce783055d1edf31f265aafa0
          python -B -m unittest discover -s implementation/partition_feedback_final/selector_v2/tests -p 'test_edr_search.py' -v
          python -B -O -m unittest discover -s implementation/partition_feedback_final/selector_v2/tests -p 'test_edr_search.py' -v
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case: [tiny_choice, small_choice]
        mode: [one, all]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e1d022496f98bf50fd57d5ef3a7a0bc8194c817c
          path: independent-proof
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          check-latest: false
      - name: Generate exact bytes and replay under independent pin
        run: |
          test "$(git -C independent-proof rev-parse HEAD)" = e1d022496f98bf50fd57d5ef3a7a0bc8194c817c
          python -B implementation/partition_feedback_final/research/p3-m2/run_case.py --case ${{ matrix.case }} --mode ${{ matrix.mode }} --proof-root independent-proof --output evidence --seconds 240 --memory-mib 5120 --entries 4000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-m2-${{ matrix.case }}-${{ matrix.mode }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
