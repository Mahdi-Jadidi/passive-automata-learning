name: Review08 RAW journal benchmark
on:
  push:
    branches: [research/v2-benchmarks]
    paths:
      - .github/workflows/review08-pipeline.yml
      - benchmarks/v2/review08_pipeline.py
      - benchmarks/v2/p3/review08-pipeline.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case: [medium_choice, huge_choice_active, hdfs_1024, hdfs_holdout_1024_uncapped]
        memory: [512, 1536]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/v2
      - uses: actions/checkout@v4
        with:
          ref: 9a361f6fa59414cc0ac262154d87c37f5aed0403
          path: source-core
          persist-credentials: false
          sparse-checkout: implementation/partition_feedback_final/selector_v2
      - uses: actions/checkout@v4
        with:
          ref: 316d4430538b8a9ef0c707b8c46727a830d42321
          path: source-proof
          persist-credentials: false
          sparse-checkout: tests/reference
      - uses: actions/checkout@v4
        with:
          ref: 122844ee5668f1c898f85b08133a562f31719718
          path: source-interface
          persist-credentials: false
          sparse-checkout: research/interface/p2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Run bounded RAW pipeline
        run: |
          python -B benchmarks/v2/review08_pipeline.py --case ${{ matrix.case }} \
            --memory-mib ${{ matrix.memory }} --producer source-core --verifier source-proof \
            --interface source-interface --output "$RUNNER_TEMP/review08"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review08-pipeline-${{ matrix.case }}-${{ matrix.memory }}
          path: |
            ${{ runner.temp }}/review08
            !${{ runner.temp }}/review08/*-source/**
          if-no-files-found: error
